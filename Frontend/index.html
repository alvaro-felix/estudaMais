<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estuda+ | Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Estuda+</h1>
    <p>Organize seus estudos e acompanhe seu progresso.</p>

    <section class="card">
      <h2>Cadastro</h2>
      <input id="cadastroNome" type="text" placeholder="Nome" />
      <input id="cadastroEmail" type="email" placeholder="E-mail" />
      <input id="cadastroSenha" type="password" placeholder="Senha" />
      <button onclick="cadastrarUsuario()">Cadastrar</button>
    </section>

    <section class="card">
      <h2>Login</h2>
      <input id="loginEmail" type="email" placeholder="E-mail" />
      <input id="loginSenha" type="password" placeholder="Senha" />
      <button onclick="login()">Entrar</button>
    </section>

    <p id="mensagem"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
